<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1F3864">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E8711A'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='900' fill='%23fff' text-anchor='middle'%3EOM%3C/text%3E%3C/svg%3E">
  <title>Employee Scorecard — OM Produce</title>
  <style>
    /* Mirrors the sheet's EMPLOYEE SCORECARD: navy header, plain rows,
       conditional fill on the utilisation column. Row height and font size
       are set from JS so every row fits the TV with no scrolling. */
    :root {
      --navy: #1F3864;
      --ink: #1A1A1A;
      --grid: #D9D9D9;
      --zebra: #F7F7F7;
      --good: #C6EFCE;
      --warn: #FFEB9C;
      --bad:  #FFC7CE;
      --err:  #C0321E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #fff; }
    body { color: var(--ink); font-family: Aptos, Calibri, 'Segoe UI', Roboto, Arial, Helvetica, sans-serif; display: flex; flex-direction: column; padding: 1.2vh 1.4vw 1vh; }

    .title-row { display: flex; align-items: baseline; gap: 16px; flex-shrink: 0; padding-bottom: .6vh; }
    .title { font-size: clamp(16px, 3vh, 40px); font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--navy); }
    .note { margin-left: auto; font-size: clamp(11px, 1.4vh, 16px); color: #888; white-space: nowrap; }
    .note.err { color: var(--err); font-weight: 700; }

    .wrap { flex: 1; min-height: 0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 16px; }
    th, td { border: 1px solid var(--grid); padding: 0 .6em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { background: var(--navy); color: #fff; font-weight: 700; text-align: center; white-space: normal; line-height: 1.15; padding: .35em .5em; border-color: var(--navy); cursor: pointer; user-select: none; -webkit-user-select: none; }
    th:hover, th:focus-visible { background: #2B4A80; outline: none; }
    th.sorted { background: #2F5597; }
    th .en, th .es { display: block; }
    th .es { font-weight: 500; font-size: .82em; color: #D6E2F5; margin-top: .15em; }
    th .arrow { font-size: .8em; }
    .title .es { margin-left: .6em; font-size: .6em; font-weight: 600; color: #6B7FA8; letter-spacing: .3px; }
    body.idle, body.idle * { cursor: none !important; }   /* pointer hides when the mouse is still */
    tbody tr:nth-child(even) td { background: var(--zebra); }
    td { text-align: center; }
    td.first { text-align: left; font-weight: 700; }
    td.num { text-align: right; }
    td.pct { text-align: center; }
    tbody tr td.good { background: var(--good); }
    tbody tr td.warn { background: var(--warn); }
    tbody tr td.bad  { background: var(--bad); }

    .msg { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #888; font-size: clamp(14px, 2.4vh, 28px); gap: 10px; }
    .msg b { color: var(--ink); font-size: 1.3em; }

    @media (max-width: 760px) {
      html, body { overflow: auto; height: auto; }
      .wrap { overflow-x: auto; }
      table { min-width: 840px; font-size: 13px; }
      td, th { height: auto !important; padding-top: 6px; padding-bottom: 6px; }
    }
  </style>
</head>
<body>
  <div class="title-row">
    <div class="title" id="title">Employee Scorecard</div>
    <div class="note" id="note"></div>
  </div>
  <div class="wrap" id="wrap"><div class="msg">Loading…</div></div>

  <script src="assets/env.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/scorecard.js"></script>
</body>
</html>
